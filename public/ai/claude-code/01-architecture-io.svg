<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 分层架构 · 扩展何时挂上</title>
  <desc id="desc">分层架构；扩展挂载点标注何时调用</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#0f766e"/>
    </marker>
    <style>
      .f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <rect width="1200" height="1280" fill="#f7f6f3"/>

  <text class="f" x="600" y="32" text-anchor="middle" fill="#1c1917" font-size="22" font-weight="700">Claude Code · 分层架构</text>
  <text class="f" x="600" y="54" text-anchor="middle" fill="#78716c" font-size="12">输入 → 接入 → Harness → 模型 / 可及面 → 输出　·　扩展条标注「何时调用」</text>

  <!-- input -->
  <rect x="48" y="70" width="1104" height="96" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="48" y="70" width="8" height="96" rx="2" fill="#ea580c"/>
  <text class="f" x="72" y="96" fill="#9a3412" font-size="14" font-weight="700">输入层</text>
  <text class="f" x="72" y="114" fill="#c2410c" font-size="11">Session 启动时 / 工作过程中进入 Context 的材料</text>

  <rect x="72" y="126" width="150" height="28" rx="6" fill="#ea580c"/>
  <text class="f" x="147" y="145" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">任务 / 提问</text>
  <rect x="236" y="126" width="150" height="28" rx="6" fill="#f97316"/>
  <text class="f" x="311" y="145" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">CLAUDE.md</text>
  <rect x="400" y="126" width="150" height="28" rx="6" fill="#fb923c"/>
  <text class="f" x="475" y="145" text-anchor="middle" fill="#1c1917" font-size="11" font-weight="700">rules / Settings</text>
  <rect x="564" y="126" width="150" height="28" rx="6" fill="#fdba74"/>
  <text class="f" x="639" y="145" text-anchor="middle" fill="#1c1917" font-size="11" font-weight="700">会话 / memory</text>
  <rect x="728" y="126" width="150" height="28" rx="6" fill="#fed7aa"/>
  <text class="f" x="803" y="145" text-anchor="middle" fill="#1c1917" font-size="11" font-weight="700">Skills 定义</text>
  <rect x="892" y="126" width="236" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text class="f" x="1010" y="145" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="700">授权 · Output style</text>

  <line x1="600" y1="166" x2="600" y2="186" stroke="#44403c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- interfaces -->
  <rect x="48" y="192" width="1104" height="58" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="48" y="192" width="8" height="58" rx="2" fill="#2563eb"/>
  <text class="f" x="72" y="216" fill="#1e3a8a" font-size="13" font-weight="700">接入层 · Interfaces</text>
  <text class="f" x="600" y="230" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">Terminal · IDE · Desktop · Web · CI/CD · Remote Control</text>

  <line x1="600" y1="250" x2="600" y2="270" stroke="#44403c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- harness -->
  <rect x="48" y="276" width="1104" height="520" rx="14" fill="#fff" stroke="#ea580c" stroke-width="3"/>
  <rect x="48" y="276" width="8" height="520" rx="2" fill="#ea580c"/>
  <text class="f" x="72" y="300" fill="#9a3412" font-size="14" font-weight="700">Harness 层 · Agentic Harness（Session）</text>
  <text class="f" x="72" y="318" fill="#c2410c" font-size="11">主环 + 门控 + 工具；扩展叠在环上 · 下面条标注何时调用</text>

  <rect x="72" y="332" width="1056" height="30" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="f" x="600" y="352" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="700">Loop · gather → act → verify　（人可打断 / 改向）</text>

  <!-- core -->
  <rect x="72" y="378" width="196" height="78" rx="9" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text class="f" x="170" y="404" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="700">Context</text>
  <text class="f" x="170" y="424" text-anchor="middle" fill="#7c2d12" font-size="10">组装每轮所见</text>
  <text class="f" x="170" y="442" text-anchor="middle" fill="#78716c" font-size="10">Compaction</text>

  <rect x="284" y="378" width="196" height="78" rx="9" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text class="f" x="382" y="404" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="700">Gate</text>
  <text class="f" x="382" y="424" text-anchor="middle" fill="#7c2d12" font-size="10">Permission · Sandbox</text>
  <text class="f" x="382" y="442" text-anchor="middle" fill="#78716c" font-size="10">Checkpoint</text>

  <rect x="496" y="378" width="196" height="78" rx="9" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text class="f" x="594" y="404" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Tools</text>
  <text class="f" x="594" y="424" text-anchor="middle" fill="#ffedd5" font-size="10">内建 + MCP 工具表</text>
  <text class="f" x="594" y="442" text-anchor="middle" fill="#fed7aa" font-size="10">读改搜跑 · 编排</text>

  <rect x="708" y="378" width="196" height="78" rx="9" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text class="f" x="806" y="404" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="700">Orchestration</text>
  <text class="f" x="806" y="424" text-anchor="middle" fill="#7c2d12" font-size="10">Subagents</text>
  <text class="f" x="806" y="442" text-anchor="middle" fill="#78716c" font-size="10">Dynamic workflow</text>

  <rect x="920" y="378" width="208" height="78" rx="9" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="f" x="1024" y="404" text-anchor="middle" fill="#57534e" font-size="12" font-weight="700">执行落点</text>
  <text class="f" x="1024" y="424" text-anchor="middle" fill="#78716c" font-size="10">Local / Cloud</text>
  <text class="f" x="1024" y="442" text-anchor="middle" fill="#a8a29e" font-size="10">Remote Control</text>

  <!-- extension band with when -->
  <rect x="72" y="476" width="1056" height="300" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text class="f" x="92" y="502" fill="#92400e" font-size="13" font-weight="700">扩展挂载 · 叠在 Loop 上（何时调用）</text>
  <text class="f" x="92" y="520" fill="#a16207" font-size="10">官方 Extend 指南：不同扩展插在 agentic loop 的不同位置</text>

  <!-- row 1: always / on demand context -->
  <rect x="92" y="536" width="248" height="72" rx="8" fill="#d97706"/>
  <text class="f" x="216" y="558" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">CLAUDE.md / rules</text>
  <text class="f" x="216" y="576" text-anchor="middle" fill="#fef3c7" font-size="10">何时：Session 启动自动加载</text>
  <text class="f" x="216" y="594" text-anchor="middle" fill="#fde68a" font-size="9">→ Context（每轮可见）</text>

  <rect x="356" y="536" width="248" height="72" rx="8" fill="#f59e0b"/>
  <text class="f" x="480" y="558" text-anchor="middle" fill="#1c1917" font-size="12" font-weight="700">Skills</text>
  <text class="f" x="480" y="576" text-anchor="middle" fill="#78350f" font-size="10">何时：你打 /name，或模型判定相关</text>
  <text class="f" x="480" y="594" text-anchor="middle" fill="#92400e" font-size="9">→ 按需进 Context</text>

  <rect x="620" y="536" width="248" height="72" rx="8" fill="#fbbf24"/>
  <text class="f" x="744" y="558" text-anchor="middle" fill="#1c1917" font-size="12" font-weight="700">MCP</text>
  <text class="f" x="744" y="576" text-anchor="middle" fill="#78350f" font-size="10">何时：模型发 tool call 调外部能力</text>
  <text class="f" x="744" y="594" text-anchor="middle" fill="#92400e" font-size="9">→ 扩展 Tools 表</text>

  <rect x="884" y="536" width="220" height="72" rx="8" fill="#fcd34d"/>
  <text class="f" x="994" y="558" text-anchor="middle" fill="#1c1917" font-size="12" font-weight="700">Hooks</text>
  <text class="f" x="994" y="576" text-anchor="middle" fill="#78350f" font-size="10">何时：生命周期事件必触发</text>
  <text class="f" x="994" y="594" text-anchor="middle" fill="#92400e" font-size="9">SessionStart / Pre·PostToolUse…</text>

  <!-- row 2 -->
  <rect x="92" y="624" width="248" height="72" rx="8" fill="#fde68a"/>
  <text class="f" x="216" y="646" text-anchor="middle" fill="#1c1917" font-size="12" font-weight="700">Subagents</text>
  <text class="f" x="216" y="664" text-anchor="middle" fill="#78350f" font-size="10">何时：主 Agent 委托隔离任务</text>
  <text class="f" x="216" y="682" text-anchor="middle" fill="#92400e" font-size="9">→ 独立 loop，摘要回主会话</text>

  <rect x="356" y="624" width="248" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text class="f" x="480" y="646" text-anchor="middle" fill="#1c1917" font-size="12" font-weight="700">Output style</text>
  <text class="f" x="480" y="664" text-anchor="middle" fill="#78350f" font-size="10">何时：整段 Session 生效</text>
  <text class="f" x="480" y="682" text-anchor="middle" fill="#92400e" font-size="9">→ 语气 / 角色 / 回复格式</text>

  <rect x="620" y="624" width="248" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text class="f" x="744" y="646" text-anchor="middle" fill="#1c1917" font-size="12" font-weight="700">Plugins</text>
  <text class="f" x="744" y="664" text-anchor="middle" fill="#78350f" font-size="10">何时：安装后随包生效</text>
  <text class="f" x="744" y="682" text-anchor="middle" fill="#92400e" font-size="9">打包 Skills/Hooks/MCP/Subagents</text>

  <rect x="884" y="624" width="220" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text class="f" x="994" y="646" text-anchor="middle" fill="#1c1917" font-size="12" font-weight="700">Code intelligence</text>
  <text class="f" x="994" y="664" text-anchor="middle" fill="#78350f" font-size="10">何时：跳转定义 / 读诊断</text>
  <text class="f" x="994" y="682" text-anchor="middle" fill="#92400e" font-size="9">→ LSP 类能力进 Tools</text>

  <text class="f" x="92" y="722" fill="#a16207" font-size="10">还有：Auto memory（会话中写入、启动加载）· Dynamic workflow / Agent teams（多 worker）· Artifacts / Channels 等 · 见正文表</text>
  <text class="f" x="92" y="742" fill="#a16207" font-size="10">Hooks 常见事件：SessionStart · PreToolUse · PostToolUse · Stop · SessionEnd …（确定性，不靠模型「想起来」）</text>
  <text class="f" x="92" y="762" fill="#78716c" font-size="10">* Agent teams 偏 experimental · `--bare` 可关掉多数扩展（CI 最小面）</text>

  <path d="M 468 456 C 500 456, 500 390, 540 390" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-teal)"/>
  <text class="f" x="556" y="386" fill="#0f766e" font-size="10" font-weight="600">工具结果回灌</text>

  <line x1="382" y1="796" x2="300" y2="824" stroke="#44403c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="594" y1="796" x2="780" y2="824" stroke="#44403c" stroke-width="2" marker-end="url(#arr)"/>
  <text class="f" x="320" y="816" fill="#78716c" font-size="10">推理</text>
  <text class="f" x="700" y="816" fill="#78716c" font-size="10">行动</text>

  <!-- model-access -->
  <rect x="48" y="830" width="420" height="100" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="48" y="830" width="8" height="100" rx="2" fill="#0f766e"/>
  <text class="f" x="72" y="856" fill="#134e4a" font-size="13" font-weight="700">模型层 · Model</text>
  <text class="f" x="72" y="876" fill="#0f766e" font-size="11">Claude（可换）· 读 Context · tool calls</text>
  <text class="f" x="72" y="896" fill="#57534e" font-size="10">「Claude chooses」多指这一层</text>
  <text class="f" x="72" y="914" fill="#78716c" font-size="10">决定何时用 Skill / MCP / Subagent</text>

  <rect x="520" y="830" width="632" height="100" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="520" y="830" width="8" height="100" rx="2" fill="#7c3aed"/>
  <text class="f" x="544" y="856" fill="#5b21b6" font-size="13" font-weight="700">可及面 · Access</text>
  <text class="f" x="544" y="876" fill="#6d28d9" font-size="11">内建 Tools + MCP 实际能碰什么</text>
  <rect x="544" y="888" width="110" height="28" rx="6" fill="#7c3aed"/>
  <text class="f" x="599" y="907" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">项目 / Git</text>
  <rect x="668" y="888" width="110" height="28" rx="6" fill="#8b5cf6"/>
  <text class="f" x="723" y="907" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Shell</text>
  <rect x="792" y="888" width="110" height="28" rx="6" fill="#a78bfa"/>
  <text class="f" x="847" y="907" text-anchor="middle" fill="#1e1b4b" font-size="10" font-weight="600">外部服务</text>
  <rect x="916" y="888" width="210" height="28" rx="6" fill="#c4b5fd"/>
  <text class="f" x="1021" y="907" text-anchor="middle" fill="#1e1b4b" font-size="10" font-weight="600">浏览器 / LSP 等</text>

  <line x1="600" y1="930" x2="600" y2="950" stroke="#44403c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="48" y="956" width="1104" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="48" y="956" width="8" height="120" rx="2" fill="#16a34a"/>
  <text class="f" x="72" y="982" fill="#14532d" font-size="13" font-weight="700">输出层</text>
  <text class="f" x="72" y="1000" fill="#15803d" font-size="10">三类去向 · Checkpoint 机制在 Gate</text>

  <rect x="72" y="1014" width="340" height="44" rx="8" fill="#16a34a"/>
  <text class="f" x="242" y="1041" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">G1 · 给你</text>

  <rect x="430" y="1014" width="340" height="44" rx="8" fill="#22c55e"/>
  <text class="f" x="600" y="1041" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">G2 · 给可及面</text>

  <rect x="788" y="1014" width="340" height="44" rx="8" fill="#4ade80"/>
  <text class="f" x="958" y="1041" text-anchor="middle" fill="#14532d" font-size="13" font-weight="700">G3 · Checkpoint 可回滚</text>

  <text class="f" x="600" y="1108" text-anchor="middle" fill="#a8a29e" font-size="11">依据 code.claude.com · How Claude Code works / Extend / Glossary</text>
  <text class="f" x="600" y="1130" text-anchor="middle" fill="#a8a29e" font-size="11">细节：04 能力面 · 05 咬合 · 06 改动入口</text>
</svg>
