<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code · 模型层与可及面</title>
  <desc id="desc">模型只发 tool call；Harness 执行；可及面与环境三分</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#0f766e"/>
    </marker>
    <style>
      .f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <rect width="1200" height="680" fill="#f7f6f3"/>
  <text class="f" x="600" y="36" text-anchor="middle" fill="#1c1917" font-size="22" font-weight="700">模型层 · 可及面 · 「环境」三分</text>
  <text class="f" x="600" y="58" text-anchor="middle" fill="#78716c" font-size="12">模型从不直接碰盘或网络——只发 tool call；Harness 解析、鉴权、执行、回灌</text>

  <!-- flow -->
  <rect x="48" y="90" width="280" height="140" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text class="f" x="188" y="130" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="700">模型层</text>
  <text class="f" x="188" y="156" text-anchor="middle" fill="#7c2d12" font-size="12">读 Context</text>
  <text class="f" x="188" y="178" text-anchor="middle" fill="#7c2d12" font-size="12">决定下一步</text>
  <text class="f" x="188" y="200" text-anchor="middle" fill="#78716c" font-size="11">文本 和/或 tool calls</text>

  <line x1="328" y1="160" x2="372" y2="160" stroke="#44403c" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="380" y="90" width="280" height="140" rx="14" fill="#ea580c" stroke="#c2410c" stroke-width="2.5"/>
  <text class="f" x="520" y="130" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Harness · Tools</text>
  <text class="f" x="520" y="156" text-anchor="middle" fill="#ffedd5" font-size="12">解析 · 过 Gate</text>
  <text class="f" x="520" y="178" text-anchor="middle" fill="#ffedd5" font-size="12">执行 · 回灌</text>
  <text class="f" x="520" y="200" text-anchor="middle" fill="#fed7aa" font-size="11">安全边界在这里</text>

  <line x1="660" y1="160" x2="704" y2="160" stroke="#44403c" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="712" y="90" width="440" height="140" rx="14" fill="#fff" stroke="#ea580c" stroke-width="2.5"/>
  <text class="f" x="932" y="130" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="700">可及面</text>
  <text class="f" x="932" y="156" text-anchor="middle" fill="#7c2d12" font-size="12">项目 / Git · Shell · 外部服务</text>
  <text class="f" x="932" y="178" text-anchor="middle" fill="#7c2d12" font-size="12">浏览器 · LSP / 诊断</text>
  <text class="f" x="932" y="200" text-anchor="middle" fill="#78716c" font-size="11">可及 ≠ 已放行（还要过 Gate）</text>

  <path d="M932 230 L932 260 L188 260 L188 230" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-teal)"/>
  <text class="f" x="560" y="252" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="600">结果回灌 Context</text>

  <!-- who decides -->
  <text class="f" x="600" y="310" text-anchor="middle" fill="#57534e" font-size="13" font-weight="700">谁决定「用不用」</text>

  <rect x="48" y="330" width="540" height="100" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text class="f" x="318" y="368" text-anchor="middle" fill="#9a3412" font-size="14" font-weight="700">多半模型在环里决定</text>
  <text class="f" x="318" y="396" text-anchor="middle" fill="#7c2d12" font-size="12">Skills · MCP · Subagent（或你显式 /）</text>

  <rect x="612" y="330" width="540" height="100" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text class="f" x="882" y="368" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="700">事件驱动 · 不经模型</text>
  <text class="f" x="882" y="396" text-anchor="middle" fill="#115e59" font-size="12">Hooks · CLAUDE.md 启动已在 Context</text>

  <!-- environment triad -->
  <text class="f" x="600" y="470" text-anchor="middle" fill="#57534e" font-size="13" font-weight="700">口语里的「环境」其实是三件事</text>

  <rect x="48" y="490" width="350" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="f" x="223" y="530" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">接入层</text>
  <text class="f" x="223" y="556" text-anchor="middle" fill="#1e40af" font-size="12">「我在 IDE 里用」</text>
  <text class="f" x="223" y="580" text-anchor="middle" fill="#64748b" font-size="11">壳：Terminal / IDE / Web…</text>

  <rect x="424" y="490" width="350" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text class="f" x="599" y="530" text-anchor="middle" fill="#9a3412" font-size="14" font-weight="700">执行落点</text>
  <text class="f" x="599" y="556" text-anchor="middle" fill="#c2410c" font-size="12">「跑本地还是云」</text>
  <text class="f" x="599" y="580" text-anchor="middle" fill="#78716c" font-size="11">Local / Cloud / Remote Control</text>

  <rect x="800" y="490" width="352" height="120" rx="12" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/>
  <text class="f" x="976" y="530" text-anchor="middle" fill="#44403c" font-size="14" font-weight="700">可及面 + Gate</text>
  <text class="f" x="976" y="556" text-anchor="middle" fill="#57534e" font-size="12">「它能改我仓库吗」</text>
  <text class="f" x="976" y="580" text-anchor="middle" fill="#78716c" font-size="11">作用对象 + 是否放行</text>

  <text class="f" x="600" y="650" text-anchor="middle" fill="#a8a29e" font-size="12">Remote Control 陷阱：界面在远端，执行与文件仍可在本地</text>
</svg>
