<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">向量与图谱双路</title>
  <desc id="desc">文档同时进向量库与知识图谱，按问题类型合并上下文后生成</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <style>.f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}</style>
  </defs>
  <rect width="880" height="420" fill="#f7f6f3"/>
  <text class="f" x="440" y="32" text-anchor="middle" fill="#1c1917" font-size="16" font-weight="700">向量 + 图谱 · 双路</text>

  <rect x="360" y="56" width="160" height="40" rx="10" fill="#44403c"/>
  <text class="f" x="440" y="82" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">文档</text>

  <path d="M400,96 V120 H200 V144" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M480,96 V120 H680 V144" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="120" y="152" width="160" height="48" rx="10" fill="#0d9488"/>
  <text class="f" x="200" y="182" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">抽实体 / 关系</text>
  <line x1="200" y1="200" x2="200" y2="228" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="232" width="160" height="48" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text class="f" x="200" y="262" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="700">知识图谱</text>
  <text class="f" x="200" y="300" text-anchor="middle" fill="#64748b" font-size="11">青 · 关系 / 全局</text>

  <rect x="600" y="152" width="160" height="48" rx="10" fill="#7c3aed"/>
  <text class="f" x="680" y="182" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Embedding</text>
  <line x1="680" y1="200" x2="680" y2="228" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="600" y="232" width="160" height="48" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="f" x="680" y="262" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="700">向量库</text>
  <text class="f" x="680" y="300" text-anchor="middle" fill="#64748b" font-size="11">紫 · 局部事实</text>

  <rect x="360" y="152" width="160" height="40" rx="10" fill="#f5f5f4" stroke="#78716c" stroke-width="2"/>
  <text class="f" x="440" y="178" text-anchor="middle" fill="#44403c" font-size="13" font-weight="700">问题</text>
  <line x1="440" y1="192" x2="440" y2="220" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M440,232 L520,268 L440,304 L360,268 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="f" x="440" y="272" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">问题类型</text>

  <path d="M360,268 H280 V280" stroke="#0d9488" stroke-width="1.5" fill="none"/>
  <text class="f" x="300" y="256" fill="#0f766e" font-size="10">关系/全局</text>
  <path d="M520,268 H600 V280" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <text class="f" x="560" y="256" fill="#5b21b6" font-size="10">局部事实</text>

  <path d="M200,280 V340 H440" stroke="#0d9488" stroke-width="2" fill="none"/>
  <path d="M680,280 V340 H440" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <line x1="440" y1="340" x2="440" y2="360" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="320" y="364" width="120" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="f" x="380" y="388" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700">合并上下文</text>
  <line x1="440" y1="400" x2="520" y2="400" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="528" y="382" width="100" height="36" rx="10" fill="#ea580c"/>
  <text class="f" x="578" y="406" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">生成</text>
</svg>
