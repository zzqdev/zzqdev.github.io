<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">进阶架构总图</title>
  <desc id="desc">用户经路由进入三路 RAG，反馈与评测再驱动索引更新</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <style>.f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}</style>
  </defs>
  <rect width="800" height="480" fill="#f7f6f3"/>
  <text class="f" x="400" y="30" text-anchor="middle" fill="#1c1917" font-size="16" font-weight="700">进阶架构 · 一张总图</text>

  <rect x="320" y="56" width="160" height="40" rx="20" fill="#44403c"/>
  <text class="f" x="400" y="82" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">用户</text>
  <line x1="400" y1="96" x2="400" y2="124" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="300" y="128" width="200" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="f" x="400" y="154" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">路由</text>

  <path d="M340,168 V196 H140 V220" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M400,168 V220" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M460,168 V196 H660 V220" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="60" y="228" width="160" height="56" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="f" x="140" y="254" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">标准增强 RAG</text>
  <text class="f" x="140" y="272" text-anchor="middle" fill="#047857" font-size="10">绿 · 主链</text>

  <rect x="320" y="228" width="160" height="56" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text class="f" x="400" y="254" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">图谱 RAG</text>
  <text class="f" x="400" y="272" text-anchor="middle" fill="#0d9488" font-size="10">青 · Graph</text>

  <rect x="580" y="228" width="160" height="56" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text class="f" x="660" y="254" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="700">Agentic RAG</text>
  <text class="f" x="660" y="272" text-anchor="middle" fill="#7e22ce" font-size="10">紫 · 多步</text>

  <path d="M140,284 V320 H400" stroke="#059669" stroke-width="1.5" fill="none"/>
  <path d="M400,284 V320" stroke="#0d9488" stroke-width="1.5" fill="none"/>
  <path d="M660,284 V320 H400" stroke="#9333ea" stroke-width="1.5" fill="none"/>
  <line x1="400" y1="320" x2="400" y2="340" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="280" y="348" width="240" height="44" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text class="f" x="400" y="376" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">反馈与评测</text>
  <line x1="400" y1="392" x2="400" y2="416" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="240" y="424" width="320" height="40" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="f" x="400" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700">索引 / 图谱 / 提示策略更新</text>

  <path d="M260,444 H100 V256" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M540,444 H700 V256" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
