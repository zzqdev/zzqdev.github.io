<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
  <title id="title">文档更新流程</title>
  <desc id="desc">先按 doc_id 删旧 Chunk，再重新解析 Embedding 入库并验证</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <style>
      .f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <rect width="900" height="200" fill="#f7f6f3"/>
  <text class="f" x="450" y="30" text-anchor="middle" fill="#1c1917" font-size="16" font-weight="700">文档更新 = 先删后写</text>

  <rect x="24" y="60" width="120" height="88" rx="12" fill="#f5f5f4" stroke="#78716c" stroke-width="2"/>
  <text class="f" x="84" y="100" text-anchor="middle" fill="#44403c" font-size="13" font-weight="700">文档更新</text>
  <text class="f" x="84" y="122" text-anchor="middle" fill="#78716c" font-size="11">触发</text>

  <line x1="144" y1="104" x2="168" y2="104" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="176" y="60" width="148" height="88" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text class="f" x="250" y="96" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">按 doc_id</text>
  <text class="f" x="250" y="118" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="700">删除旧 Chunk</text>
  <text class="f" x="250" y="136" text-anchor="middle" fill="#64748b" font-size="10">红 · 防过期命中</text>

  <line x1="324" y1="104" x2="348" y2="104" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="356" y="60" width="160" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="f" x="436" y="96" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700">重新解析 / 切分</text>
  <text class="f" x="436" y="118" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">Embedding</text>
  <text class="f" x="436" y="136" text-anchor="middle" fill="#64748b" font-size="10">蓝+紫</text>

  <line x1="516" y1="104" x2="540" y2="104" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="548" y="60" width="140" height="88" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="f" x="618" y="106" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="700">insert 新 Chunk</text>
  <text class="f" x="618" y="128" text-anchor="middle" fill="#64748b" font-size="10">橙 · 写入</text>

  <line x1="688" y1="104" x2="712" y2="104" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="720" y="60" width="156" height="88" rx="12" fill="#1c1917"/>
  <text class="f" x="798" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">再问原问题</text>
  <text class="f" x="798" y="122" text-anchor="middle" fill="#d6d3d1" font-size="12">验证</text>

  <text class="f" x="450" y="180" text-anchor="middle" fill="#a8a29e" font-size="11">不要只 insert 不 delete（会重复命中）</text>
</svg>
