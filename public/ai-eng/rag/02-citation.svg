<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160" role="img" aria-labelledby="title desc">
  <title id="title">引用角标溯源</title>
  <desc id="desc">回答角标映射到 refs，再定位 doc_id 与原文高亮</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <style>.f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}</style>
  </defs>
  <rect width="880" height="160" fill="#f7f6f3"/>
  <text class="f" x="440" y="28" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="700">引用角标 · 可点回原文</text>

  <rect x="32" y="56" width="160" height="64" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="f" x="112" y="86" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="700">回答中的角标</text>
  <text class="f" x="112" y="106" text-anchor="middle" fill="#c2410c" font-size="11">橙 · 生成侧</text>
  <line x1="192" y1="88" x2="224" y2="88" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="232" y="56" width="160" height="64" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="f" x="312" y="86" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">refs 列表</text>
  <text class="f" x="312" y="106" text-anchor="middle" fill="#1d4ed8" font-size="11">本轮真实召回</text>
  <line x1="392" y1="88" x2="424" y2="88" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="432" y="56" width="180" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="f" x="522" y="86" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">doc_id + chunk</text>
  <text class="f" x="522" y="106" text-anchor="middle" fill="#047857" font-size="11">绿 · 定位</text>
  <line x1="612" y1="88" x2="644" y2="88" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="652" y="56" width="196" height="64" rx="12" fill="#1c1917"/>
  <text class="f" x="750" y="86" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">原文高亮</text>
  <text class="f" x="750" y="106" text-anchor="middle" fill="#d6d3d1" font-size="11">前端对齐</text>
</svg>
