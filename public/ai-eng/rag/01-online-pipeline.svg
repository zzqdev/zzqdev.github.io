<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">检索生成（在线）</title>
  <desc id="desc">用户问题经 Embedding、检索、组装上下文后由大模型生成回答</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <style>
      .f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <rect width="1080" height="380" fill="#f7f6f3"/>
  <text class="f" x="540" y="34" text-anchor="middle" fill="#1c1917" font-size="18" font-weight="700">检索生成 · 在线</text>
  <text class="f" x="540" y="56" text-anchor="middle" fill="#78716c" font-size="12">按问题取知识，再交给模型回答</text>

  <!-- 提问 -->
  <rect x="32" y="90" width="128" height="200" rx="14" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2"/>
  <text class="f" x="96" y="120" text-anchor="middle" fill="#57534e" font-size="12" font-weight="700">提问</text>
  <rect x="48" y="148" width="96" height="72" rx="12" fill="#44403c"/>
  <text class="f" x="96" y="180" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">用户问题</text>
  <text class="f" x="96" y="200" text-anchor="middle" fill="#d6d3d1" font-size="11">自然语言</text>
  <text class="f" x="96" y="260" text-anchor="middle" fill="#78716c" font-size="11">灰：输入</text>

  <line x1="160" y1="184" x2="192" y2="184" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <!-- 向量查询 -->
  <rect x="200" y="90" width="220" height="200" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="200" y="90" width="8" height="200" rx="2" fill="#7c3aed"/>
  <text class="f" x="228" y="120" fill="#5b21b6" font-size="12" font-weight="700">向量查询</text>
  <rect x="228" y="140" width="164" height="44" rx="10" fill="#7c3aed"/>
  <text class="f" x="310" y="168" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Embedding</text>
  <line x1="310" y1="184" x2="310" y2="204" stroke="#6d28d9" stroke-width="2" marker-end="url(#a)"/>
  <rect x="228" y="208" width="164" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="f" x="310" y="236" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="700">向量库</text>
  <text class="f" x="310" y="270" text-anchor="middle" fill="#64748b" font-size="11">紫：与离线同一套</text>

  <!-- side note arrow into 检索 -->
  <path d="M420,168 H448" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M310,252 H360 V168" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <text class="f" x="372" y="200" fill="#7c3aed" font-size="10">库内查</text>

  <!-- 检索 -->
  <rect x="456" y="90" width="128" height="200" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="456" y="90" width="8" height="200" rx="2" fill="#059669"/>
  <text class="f" x="484" y="120" fill="#065f46" font-size="12" font-weight="700">召回</text>
  <rect x="476" y="148" width="88" height="72" rx="12" fill="#059669"/>
  <text class="f" x="520" y="180" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">检索</text>
  <text class="f" x="520" y="200" text-anchor="middle" fill="#d1fae5" font-size="11">Top-K</text>
  <text class="f" x="520" y="260" text-anchor="middle" fill="#64748b" font-size="11">绿：捞 Chunk</text>

  <line x1="584" y1="184" x2="616" y2="184" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <!-- 组装 -->
  <rect x="624" y="90" width="140" height="200" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="624" y="90" width="8" height="200" rx="2" fill="#2563eb"/>
  <text class="f" x="652" y="120" fill="#1e40af" font-size="12" font-weight="700">拼 Prompt</text>
  <rect x="644" y="148" width="100" height="72" rx="12" fill="#2563eb"/>
  <text class="f" x="694" y="176" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">组装</text>
  <text class="f" x="694" y="196" text-anchor="middle" fill="#dbeafe" font-size="12" font-weight="700">上下文</text>
  <text class="f" x="694" y="260" text-anchor="middle" fill="#64748b" font-size="11">蓝：材料入模</text>

  <line x1="764" y1="184" x2="796" y2="184" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <!-- 生成 -->
  <rect x="804" y="90" width="244" height="200" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="804" y="90" width="8" height="200" rx="2" fill="#ea580c"/>
  <text class="f" x="832" y="120" fill="#9a3412" font-size="12" font-weight="700">生成</text>
  <rect x="832" y="140" width="100" height="56" rx="10" fill="#ea580c"/>
  <text class="f" x="882" y="164" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">大模型</text>
  <text class="f" x="882" y="182" text-anchor="middle" fill="#ffedd5" font-size="11">生成</text>
  <line x1="932" y1="168" x2="956" y2="168" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="960" y="140" width="64" height="56" rx="10" fill="#1c1917"/>
  <text class="f" x="992" y="174" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">回答</text>
  <text class="f" x="926" y="230" text-anchor="middle" fill="#c2410c" font-size="11">系统说明 + 片段 + 问题</text>
  <text class="f" x="926" y="260" text-anchor="middle" fill="#64748b" font-size="11">橙：产出 · 黑：结果</text>

  <text class="f" x="540" y="340" text-anchor="middle" fill="#a8a29e" font-size="11">紫段与离线共用 Embedding / 向量库；绿召回 → 蓝组装 → 橙生成</text>
</svg>
