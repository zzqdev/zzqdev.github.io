<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">批量入库与失败重试</title>
  <desc id="desc">逐文件处理，失败记日志，全部跑完后重试 failed 列表</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#44403c"/>
    </marker>
    <style>
      .f{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    </style>
  </defs>

  <rect width="720" height="520" fill="#f7f6f3"/>
  <text class="f" x="360" y="34" text-anchor="middle" fill="#1c1917" font-size="18" font-weight="700">批量入库与失败重试</text>
  <text class="f" x="360" y="56" text-anchor="middle" fill="#78716c" font-size="12">按文件推进 · 失败可重跑</text>

  <rect x="260" y="80" width="200" height="40" rx="10" fill="#44403c"/>
  <text class="f" x="360" y="106" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">扫描目录</text>
  <line x1="360" y1="120" x2="360" y2="148" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="240" y="152" width="240" height="40" rx="10" fill="#2563eb"/>
  <text class="f" x="360" y="178" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">逐文件处理</text>
  <line x1="360" y1="192" x2="360" y2="220" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>

  <path d="M360,232 L450,272 L360,312 L270,272 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="f" x="360" y="276" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">成功？</text>

  <!-- yes -->
  <path d="M270,272 H140 V320" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="f" x="190" y="260" fill="#047857" font-size="12" font-weight="700">是</text>
  <rect x="48" y="328" width="184" height="56" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="f" x="140" y="354" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">记 success 日志</text>
  <text class="f" x="140" y="374" text-anchor="middle" fill="#047857" font-size="11">绿</text>

  <!-- no -->
  <path d="M450,272 H580 V320" stroke="#44403c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text class="f" x="500" y="260" fill="#b91c1c" font-size="12" font-weight="700">否</text>
  <rect x="488" y="328" width="184" height="72" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text class="f" x="580" y="354" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">记 failed</text>
  <text class="f" x="580" y="374" text-anchor="middle" fill="#b91c1c" font-size="11">文件 / 阶段 / 错误</text>
  <text class="f" x="580" y="392" text-anchor="middle" fill="#64748b" font-size="10">红 · 跳过继续</text>

  <!-- loop back -->
  <path d="M140,384 V420 H360 V192" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <path d="M580,400 V420 H380" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <text class="f" x="260" y="440" fill="#57534e" font-size="11">下一文件 ← 循环</text>

  <!-- after all -->
  <rect x="200" y="456" width="320" height="44" rx="12" fill="#1c1917"/>
  <text class="f" x="360" y="484" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">全部跑完 → 重试 failed 列表</text>
</svg>
